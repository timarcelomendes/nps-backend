# Blueprint do Render: backend da Rakiti (Docker) + PostgreSQL do Render.
# O banco foi criado manualmente no painel; cole a Internal Database URL em DATABASE_URL.
services:
  - type: web
    name: rakiti-api
    runtime: docker
    region: oregon            # TEM de ser a mesma região do banco (data_rakiti está em oregon)
    plan: free                # grátis para testes; troque para starter quando tiver cliente (não dorme, agendador roda)
    numInstances: 1           # 1 instância: o agendador e o disco não suportam várias
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: AMBIENTE
        value: prod
      - key: DATABASE_URL
        sync: false           # Internal Database URL do Postgres no Render
      - key: FRONTEND_URL
        sync: false           # ex.: https://app.rakiti.com
      - key: JWT_SECRET_KEY
        generateValue: true   # o Render gera uma chave aleatória
      - key: ENCRYPTION_KEY
        sync: false           # gere com: python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        value: pesquisa@rakiti.com
      - key: EMAIL_REMETENTE_NOME
        value: Rakiti
      - key: ADMIN_EMAIL
        sync: false           # seu e-mail de Admin (criado sozinho na 1ª inicialização)
      - key: ADMIN_SENHA
        sync: false           # senha inicial do Admin (troque depois pela tela de perfil)
      - key: ADMIN_NOME
        value: Marcelo Mendes
      - key: DOMINIOS_PERMITIDOS
        sync: false           # ex.: rakiti.com, gmail.com (padrão: domínio do ADMIN_EMAIL)
      - key: OPENAI_API_KEY
        sync: false           # opcional (também pode ser salva na tela de Configurações)
    # Disco persistente para uploads: disponível só em plano pago. Ao mudar para starter, descomente:
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
