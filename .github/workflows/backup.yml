# Backup diário do banco de produção (pg_dump criptografado).
#
# Segredos necessários em Settings > Secrets and variables > Actions:
#   BACKUP_DATABASE_URL   URL EXTERNA do banco no Render (com ?sslmode=require)
#   BACKUP_SENHA          senha longa para criptografar o arquivo (guarde num cofre de senhas!)
# Opcionais (cópia fora do GitHub, em qualquer armazenamento compatível com S3: Cloudflare R2, Backblaze B2, AWS):
#   BACKUP_S3_BUCKET, BACKUP_S3_ENDPOINT, BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY
#
# Restaurar: veja docs/BACKUP.md
name: Backup do banco

on:
  schedule:
    - cron: "15 6 * * *"   # todo dia às 03:15 (horário de Brasília)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - name: Instalar cliente do PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18

      - name: Gerar e criptografar o backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "Falta o segredo BACKUP_DATABASE_URL"; exit 1; }
          test -n "$BACKUP_SENHA" || { echo "Falta o segredo BACKUP_SENHA"; exit 1; }
          ARQ="rakiti-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" > "$ARQ"
          test -s "$ARQ" || { echo "Backup vazio"; exit 1; }
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$BACKUP_SENHA" -o "$ARQ.gpg" "$ARQ"
          rm -f "$ARQ"
          ls -lh "$ARQ.gpg"
          echo "ARQUIVO=$ARQ.gpg" >> "$GITHUB_ENV"

      - name: Guardar no GitHub (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARQUIVO }}
          path: ${{ env.ARQUIVO }}
          retention-days: 30

      - name: Cópia externa (S3/R2/B2), se configurada
        env:
          ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        if: env.BUCKET != ''
        run: aws s3 cp "$ARQUIVO" "s3://$BUCKET/rakiti/$ARQUIVO" --endpoint-url "$ENDPOINT"
